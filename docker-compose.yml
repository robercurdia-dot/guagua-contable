services:
  db:
    image: postgres:16
    environment:
      # Superusuario solo para inicializar; la app usa el rol "guagua"
      # (sin privilegios de superusuario), creado en docker/init.sql.
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
