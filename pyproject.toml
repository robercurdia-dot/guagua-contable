[project]
name = "guagua-contable"
version = "0.1.0"
description = "Software de contabilidad y facturacion para autonomos, pymes y despachos (Verifactu)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "segno>=1.6",
    "lxml>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Ruleset EXPLICITO: el CI no debe depender de la configuracion ambiental de
# la maquina donde corre ruff.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # longitud: la controla el formateador, no rompe el build
    "B008",  # Depends() en argumentos por defecto es el idioma de FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Los tests comprueban a proposito casos invalidos (p.ej. datetime sin huso).
# dict(...) con kwargs es mas legible que un literal en fixtures de test.
"tests/*" = ["DTZ001", "C408"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
